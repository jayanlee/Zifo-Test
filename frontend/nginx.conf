server {
    listen 80;
    server_name localhost;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # These headers are the local stand-in for a CloudFront response-headers policy.
    # Strict-Transport-Security is omitted on purpose. On HTTPS it tells the browser
    # to keep using HTTPS for this host. Setting it on http://localhost makes the
    # browser refuse the demo.

    # The Vite build loads only its own script and CSS files. The browser refuses
    # inline scripts and scripts from any other host.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # The browser honors the stated content type and does not sniff a response into a script.
    add_header X-Content-Type-Options "nosniff" always;

    # The app cannot sit in another site's iframe (clickjacking).
    # frame-ancestors 'none' in the CSP says the same thing to current browsers.
    add_header X-Frame-Options "DENY" always;

    # The browser does not send this page's URL to other sites.
    add_header Referrer-Policy "no-referrer" always;

    # The page cannot request the camera, microphone, or location.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # CloudFront behavior: /api/auth/* -> ALB -> auth service.
    # Client headers, including Authorization, are forwarded. CloudFront must do the
    # same for API behaviors, and those responses must not be cached.
    location /api/auth {
        proxy_pass http://auth-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # CloudFront behavior: /api/tasks/* -> ALB -> task service.
    location /api/tasks {
        proxy_pass http://task-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # S3/CloudFront default behavior. Unknown client routes fall back to index.html
    # so a reload on /dashboard still boots React. In AWS, do this with a function
    # on the S3 behavior only, so an API 404 is not rewritten into index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
