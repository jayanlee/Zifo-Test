name: auth-service

on:
  push:
    branches: [main]
    paths:
      - "auth-service/**"
      - ".github/workflows/auth-service.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push
        env:
          ECR: 229691749767.dkr.ecr.ap-southeast-2.amazonaws.com
        run: |
          IMAGE=$ECR/jayan/zifo-auth:${GITHUB_SHA}
          docker build -t "$IMAGE" ./auth-service
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Fetch task definition
        run: |
          set -euo pipefail
          aws ecs describe-task-definition \
            --task-definition jayan-zifo-auth \
            --output json > task-def-raw.json
          jq '.taskDefinition | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy,.deregisteredAt)' \
            task-def-raw.json > auth-task-def.json
          test -s auth-task-def.json
          jq -e 'type == "object" and .family == "jayan-zifo-auth"' auth-task-def.json
      - id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: auth-task-def.json
          container-name: auth
          image: ${{ env.IMAGE }}
      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: auth
          cluster: jayan-test-zifo
          wait-for-service-stability: true
